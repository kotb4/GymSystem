<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlowH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="emeraldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="24" fill="#090d16"/>
  <rect width="894" height="234" x="3" y="3" rx="21" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Icon Frame (Hexagon Gate) -->
  <g transform="translate(40, 20)">
    <!-- Hexagonal Gate Outer Frame -->
    <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" 
             fill="#0f172a" 
             stroke="url(#neonGlowH)" 
             stroke-width="5" 
             stroke-linejoin="round"
             filter="url(#glowH)"/>

    <!-- 'G' Letterform -->
    <path d="M 135 75 
             A 45 45 0 1 0 135 125 
             L 135 105 
             L 98 105" 
          fill="none" 
          stroke="url(#neonGlowH)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowH)"/>

    <!-- Dumbbell Bar -->
    <rect x="92" y="100" width="26" height="10" rx="3" fill="url(#emeraldGradH)"/>
  </g>

  <!-- Text & Typography (Right Side) -->
  <!-- Brand Name English -->
  <text x="250" y="105" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="1">
    Gym<tspan fill="url(#neonGlowH)">Gate</tspan>
  </text>

  <!-- Brand Name Arabic Tag -->
  <rect x="525" y="60" width="95" height="38" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="572" y="86" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" fill="#22d3ee" text-anchor="middle">
    جيم جيت
  </text>

  <!-- Arabic Subtitle / Slogan -->
  <text x="252" y="152" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#94a3b8">
    بوابتك الذكية لإدارة متكاملة واحترافية لصالتك الرياضية
  </text>

  <!-- Feature Pills -->
  <g transform="translate(252, 175)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0e7490" fill-opacity="0.2" stroke="#0891b2" stroke-width="1"/>
    <text x="65" y="18" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">⚡ يعمل أوفلاين</text>

    <rect x="140" y="0" width="150" height="26" rx="13" fill="#065f46" fill-opacity="0.2" stroke="#059669" stroke-width="1"/>
    <text x="215" y="18" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">📲 كارت واتساب ذكي</text>

    <rect x="300" y="0" width="135" height="26" rx="13" fill="#312e81" fill-opacity="0.2" stroke="#4338ca" stroke-width="1"/>
    <text x="367" y="18" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">🔒 خزينة مزدوجة</text>
  </g>
</svg>
