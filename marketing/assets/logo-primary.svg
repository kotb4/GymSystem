<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Cyan to Emerald Neon Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon Base -->
  <rect width="500" height="500" rx="48" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="46" fill="none" stroke="url(#neonGlow)" stroke-width="2.5" opacity="0.4"/>

  <!-- Geometric Grid Accent (Subtle) -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" opacity="0.5"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3"/>

  <!-- Hexagonal Gate Outer Frame -->
  <polygon points="250,75 390,155 390,345 250,425 110,345 110,155" 
           fill="#0f172a" 
           stroke="url(#neonGlow)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#glowFilter)"/>

  <!-- Inner Gate Bars (Gate Concept) -->
  <line x1="180" y1="180" x2="180" y2="320" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="320" y1="180" x2="320" y2="320" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

  <!-- Dynamic GymGate Icon: Stylized 'G' with Dumbbell Energy -->
  <!-- Outer C-Ring of G -->
  <path d="M 330 190 
           A 100 100 0 1 0 330 310 
           L 330 260 
           L 245 260" 
        fill="none" 
        stroke="url(#neonGlow)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Dumbbell Center Core / Gate Latch -->
  <rect x="235" y="248" width="55" height="24" rx="6" fill="url(#emeraldGrad)"/>
  <rect x="290" y="240" width="16" height="40" rx="4" fill="#00f2fe"/>
  <rect x="219" y="240" width="16" height="40" rx="4" fill="#10b981"/>

  <!-- Tech Dots / Access Nodes -->
  <circle cx="250" cy="115" r="7" fill="#00f2fe"/>
  <circle cx="360" cy="178" r="5" fill="#34d399"/>
  <circle cx="360" cy="322" r="5" fill="#06b6d4"/>
  <circle cx="250" cy="385" r="7" fill="#10b981"/>
  <circle cx="140" cy="322" r="5" fill="#00f2fe"/>
  <circle cx="140" cy="178" r="5" fill="#34d399"/>
</svg>
